[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-clean"
version = "0.1.2"
description = "Scan and clean Cursor Roaming data: old chats and unused agent versions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cursor-clean contributors" }]
keywords = ["cursor", "cleanup", "disk", "sqlite", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://pypi.org/project/cursor-clean/"

[project.scripts]
cursor-clean = "cursor_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
